<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>NMOS Controller - Control</title>
    <link rel="stylesheet" href="/static/gui1/shell.css">
</head>
<body>
    <!--
        枠ページ（/ で表示）
        Control / Node GUI / System の3画面を、1つのブラウザタブ内の
        タブとして iframe で切り替える。各画面の中身は既存ページのまま。
          Control  : /static/gui1/control.html
          Node GUI : /node/
          System   : /system/
    -->

    <!-- タブ行 -->
    <header class="shell-bar">
        <span class="shell-logo">⬡</span>
        <span class="shell-title">NMOS Controller</span>
        <nav class="shell-tabs" role="tablist">
            <button class="shell-tab" id="tab-control"
                role="tab" data-tab="control"
                onclick="switchShellTab('control')">Control</button>
            <button class="shell-tab" id="tab-node"
                role="tab" data-tab="node"
                onclick="switchShellTab('node')">Node GUI</button>
            <button class="shell-tab" id="tab-system"
                role="tab" data-tab="system"
                onclick="switchShellTab('system')">System</button>
        </nav>
    </header>

    <!-- 各画面（初めて開いたタブから読み込む） -->
    <main class="shell-frames">
        <iframe class="shell-frame" id="frame-control"
            title="Control" data-tab="control"></iframe>
        <iframe class="shell-frame" id="frame-node"
            title="Node GUI" data-tab="node"></iframe>
        <iframe class="shell-frame" id="frame-system"
            title="System" data-tab="system"></iframe>
    </main>

    <script src="/static/gui1/shell.js"></script>
</body>
</html>
